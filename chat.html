<!DOCTYPE html>
<html lang="hi" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Chat — ChatWave</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>" />
<script>document.documentElement.dataset.theme = localStorage.getItem("cw-theme") || "dark";</script>
</head>
<body class="chat-body">

  <div class="chat-shell">

    <!-- ===== HEADER ===== -->
    <header class="chat-header">
      <button class="icon-btn" id="backBtn" title="Wapas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <div class="avatar sm" id="peerAvatar">?</div>
      <div class="ch-info">
        <div class="ch-name" id="peerName">Loading…</div>
        <div class="ch-status" id="peerStatus">…</div>
      </div>
      <div class="ch-actions">
        <button class="icon-btn" id="audioCallBtn" title="Audio call">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
        </button>
        <button class="icon-btn" id="videoCallBtn" title="Video call">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
          </svg>
        </button>
        <button class="icon-btn" id="chatMenuBtn" title="Menu">⋮</button>
      </div>
    </header>

    <!-- ===== MESSAGES ===== -->
    <main class="messages" id="messages">
      <div class="msgs-inner" id="msgsInner">
        <div class="day-chip" id="encNote">🔒 Messages end-to-end encrypted hain</div>
      </div>
      <button class="scroll-down" id="scrollDown" hidden>↓</button>
    </main>

    <!-- ===== TYPING ===== -->
    <div class="typing-bar" id="typingBar" hidden>
      <span class="t-dots"><i></i><i></i><i></i></span>
      <span id="typingWho">typing…</span>
    </div>

    <!-- ===== COMPOSER ===== -->
    <footer class="composer">
      <button class="icon-btn" id="emojiBtn" title="Emoji">😊</button>
      <div class="composer-input">
        <textarea id="msgInput" rows="1" placeholder="Message likho…" maxlength="2000"></textarea>
      </div>
      <button class="icon-btn send" id="sendBtn" title="Bhejo" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </footer>

    <!-- ===== EMOJI PICKER ===== -->
    <div class="emoji-picker" id="emojiPicker" hidden></div>

    <!-- ===== CHAT MENU SHEET ===== -->
    <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
    <aside class="sheet" id="chatSheet" hidden>
      <div class="sheet-head">
        <div class="avatar lg" id="sheetAvatar">?</div>
        <h3 id="sheetName">—</h3>
        <p id="sheetStatus">—</p>
      </div>
      <div class="sheet-actions">
        <button class="sheet-item" id="clearChatItem">🧹 <span>Chat clear karo</span></button>
        <button class="sheet-item danger" id="deleteChatItem">🗑️ <span>Chat delete karo</span></button>
      </div>
    </aside>
  </div>

  <div class="toast-wrap" id="toastWrap"></div>

  <script type="module">
    import {
      auth, db, toast, timeAgo, initials, avatarColor, initCallListener,
      chatIdFor, ICE_SERVERS
    } from "./firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      doc, getDoc, setDoc, onSnapshot, collection, addDoc, query,
      orderBy, serverTimestamp, updateDoc, deleteDoc, getDocs,
      writeBatch, increment, limit
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    /* ---------- Theme ---------- */
    const themeBtn = document.createElement("button");
    (function initTheme() {
      const t = document.documentElement.dataset.theme;
      // theme toggling via header menu button handled below
    })();

    const params = new URLSearchParams(location.search);
    const peerUid = params.get("u");
    if (!peerUid) location.replace("dashboard.html");

    let me = null;
    let peer = null;
    let chatId = null;
    let chatRef = null;
    let unsubMsgs = null;
    let unsubChat = null;
    let typingTimer = null;
    let lastMsgCount = 0;
    let firstLoad = true;

    const msgsInner = document.getElementById("msgsInner");
    const messagesEl = document.getElementById("messages");
    const input = document.getElementById("msgInput");
    const sendBtn = document.getElementById("sendBtn");
    const scrollDown = document.getElementById("scrollDown");

    /* ---------- Auth ---------- */
    onAuthStateChanged(auth, async (user) => {
      if (!user) { location.replace("index.html"); return; }
      me = user;
      chatId = chatIdFor(me.uid, peerUid);
      chatRef = doc(db, "chats", chatId);

      // ensure chat doc
      const cSnap = await getDoc(chatRef);
      if (!cSnap.exists()) {
        await setDoc(chatRef, {
          members: [me.uid, peerUid].sort(),
          createdAt: serverTimestamp(),
          lastMessage: "",
          lastMessageAt: serverTimestamp(),
          lastSender: "",
          unread: {},
          typing: {}
        });
      } else {
        // reset unread for me
        await updateDoc(chatRef, { [`unread.${me.uid}`]: 0 });
      }

      await loadPeer();
      listenChatMeta();
      listenMessages();
      initCallListener(user);
      window.addEventListener("beforeunload", () => {
        setTyping(false);
      });
    });

    /* ---------- Peer info ---------- */
    async function loadPeer() {
      const snap = await getDoc(doc(db, "users", peerUid));
      peer = snap.exists() ? snap.data() : { uid: peerUid, name: "User" };
      const name = peer.name || "User";
      document.getElementById("peerName").textContent = name;
      document.getElementById("sheetName").textContent = name;
      document.getElementById("sheetStatus").textContent = peer.online ? "Online" : (peer.lastSeen ? "Last seen " + timeAgo(peer.lastSeen?.toMillis?.() || 0) : "Offline");
      const av = document.getElementById("peerAvatar");
      av.textContent = initials(name);
      av.style.background = avatarColor(peerUid);
      const av2 = document.getElementById("sheetAvatar");
      av2.textContent = initials(name);
      av2.style.background = avatarColor(peerUid);

      // live presence
      onSnapshot(doc(db, "users", peerUid), (s) => {
        if (!s.exists()) return;
        peer = s.data();
        const online = !!peer.online;
        document.getElementById("peerStatus").textContent = online
          ? "🟢 Online"
          : (peer.lastSeen ? "Last seen " + timeAgo(peer.lastSeen?.toMillis?.() || 0) : "Offline");
        document.getElementById("peerStatus").classList.toggle("on", online);
        document.getElementById("sheetStatus").textContent = online ? "Online" : "Offline";
      });
    }

    /* ---------- Chat meta (typing + last) ---------- */
    function listenChatMeta() {
      unsubChat = onSnapshot(chatRef, (s) => {
        if (!s.exists()) return;
        const d = s.data();
        const isTyping = !!d.typing?.[peerUid];
        document.getElementById("typingBar").hidden = !isTyping;
        document.getElementById("typingWho").textContent = `${peer?.name || "User"} typing…`;
        document.getElementById("peerStatus").textContent = isTyping
          ? "typing…"
          : (peer?.online ? "🟢 Online" : (peer?.lastSeen ? "Last seen " + timeAgo(peer.lastSeen?.toMillis?.() || 0) : "Offline"));
      });
    }

    /* ---------- Messages ---------- */
    function listenMessages() {
      const q = query(collection(db, "chats", chatId, "messages"), orderBy("createdAt", "asc"), limit(500));
      unsubMsgs = onSnapshot(q, (snap) => {
        const docs = snap.docs;
        const wasNearBottom = isNearBottom();

        msgsInner.innerHTML = `<div class="day-chip">🔒 Messages end-to-end encrypted hain</div>`;

        let lastDay = "";
        let lastSender = "";

        docs.forEach((d) => {
          const m = d.data();
          const ts = m.createdAt?.toMillis?.() || Date.now();
          const day = dayLabel(ts);
          if (day !== lastDay) {
            const chip = document.createElement("div");
            chip.className = "day-chip date";
            chip.textContent = day;
            msgsInner.appendChild(chip);
            lastDay = day;
            lastSender = "";
          }

          const mine = m.senderId === me.uid;
          const grouped = lastSender === m.senderId;
          const el = document.createElement("div");
          el.className = `msg ${mine ? "out" : "in"} ${grouped ? "grouped" : ""}`;
          el.dataset.id = d.id;
          el.innerHTML = `
            <div class="bubble">
              <span class="txt">${linkify(esc(m.text || ""))}</span>
              <span class="meta">
                <span class="t">${fmtTime(ts)}</span>
                ${mine ? `<span class="tick">${m.read ? "✓✓" : "✓"}</span>` : ""}
              </span>
            </div>`;
          msgsInner.appendChild(el);
          lastSender = m.senderId;

          if (!mine && !m.read) {
            updateDoc(doc(db, "chats", chatId, "messages", d.id), { read: true }).catch(() => {});
          }
        });

        // mark chat read
        updateDoc(chatRef, { [`unread.${me.uid}`]: 0 }).catch(() => {});

        if (firstLoad || wasNearBottom) {
          requestAnimationFrame(() => scrollToBottom(firstLoad ? "auto" : "smooth"));
        }
        firstLoad = false;
        lastMsgCount = docs.length;

        const last = docs[docs.length - 1];
        if (last) {
          document.getElementById("peerStatus").dataset.lastId = last.id;
        }
      });
    }

    /* ---------- Send ---------- */
    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      input.value = "";
      autoGrow();
      sendBtn.disabled = true;

      try {
        await addDoc(collection(db, "chats", chatId, "messages"), {
          text,
          senderId: me.uid,
          createdAt: serverTimestamp(),
          read: false,
          type: "text"
        });

        await updateDoc(chatRef, {
          lastMessage: text.length > 60 ? text.slice(0, 60) + "…" : text,
          lastMessageAt: serverTimestamp(),
          lastSender: me.uid,
          [`unread.${peerUid}`]: increment(1),
          [`typing.${me.uid}`]: false
        });
      } catch (e) {
        console.error(e);
        toast("Message nahi gaya, dobara try karo", "error");
        input.value = text;
      }
    }

    sendBtn.onclick = sendMessage;
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    /* ---------- Typing ---------- */
    input.addEventListener("input", () => {
      autoGrow();
      sendBtn.disabled = !input.value.trim();
      setTyping(true);
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => setTyping(false), 1400);
    });

    function setTyping(on) {
      if (!chatRef || !me) return;
      updateDoc(chatRef, { [`typing.${me.uid}`]: on }).catch(() => {});
    }

    function autoGrow() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 140) + "px";
    }

    /* ---------- Scroll helpers ---------- */
    function isNearBottom() {
      return messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 140;
    }
    function scrollToBottom(behavior = "smooth") {
      messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior });
    }
    messagesEl.addEventListener("scroll", () => {
      scrollDown.hidden = isNearBottom();
    });
    scrollDown.onclick = () => scrollToBottom("smooth");

    /* ---------- Emoji picker ---------- */
    const EMOJIS = ["😀","😃","😄","😁","😆","😅","🤣","😂","🙂","🙃","😉","😊","😇","🥰","😍","🤩","😘","😗","😚","😙","😋","😛","😜","🤪","😝","🤗","🤔","🤨","😐","😑","😶","😏","😒","🙄","😬","😴","🤤","😪","😷","🤒","🤕","🤢","🤮","🥵","🥶","😵","🤯","🤠","🥳","😎","🤓","🧐","😕","😟","🙁","😮","😯","😲","😳","🥺","😦","😧","😨","😰","😥","😢","😭","😱","😖","😣","😞","😓","😩","😫","🥱","😤","😡","😠","🤬","😈","👿","💀","☠️","💩","🤡","👹","👺","👻","👽","🤖","😺","😸","😹","😻","😼","😽","🙀","😿","😾",
      "❤️","🧡","💛","💚","💙","💜","🖤","🤍","🤎","💔","❣️","💕","💞","💓","💗","💖","💘","💝","💟","✌️","🤞","🤟","🤘","👌","👍","👎","👊","✊","🤛","🤜","👏","🙌","👐","🤲","🙏","✍️","💪","🦾","👋","🤚","🖐️","✋","🖖","👀","👁️","🧠","👶","🧒","👦","👧","🧑","👨","👩","🧓","👴","👵"];
    const emojiPicker = document.getElementById("emojiPicker");
    emojiPicker.innerHTML = EMOJIS.map(e => `<button type="button">${e}</button>`).join("");
    document.getElementById("emojiBtn").onclick = (e) => {
      e.stopPropagation();
      emojiPicker.hidden = !emojiPicker.hidden;
    };
    emojiPicker.onclick = (e) => {
      if (e.target.tagName === "BUTTON") {
        input.value += e.target.textContent;
        input.dispatchEvent(new Event("input"));
        input.focus();
      }
    };
    document.addEventListener("click", (e) => {
      if (!emojiPicker.hidden && !emojiPicker.contains(e.target) && e.target.id !== "emojiBtn") {
        emojiPicker.hidden = true;
      }
    });

    /* ---------- Header actions ---------- */
    document.getElementById("backBtn").onclick = () => {
      setTyping(false);
      location.href = "dashboard.html";
    };

    document.getElementById("audioCallBtn").onclick = () => startCall("audio");
    document.getElementById("videoCallBtn").onclick = () => startCall("video");

    async function startCall(type) {
      try {
        const callRef = doc(collection(db, "calls"));
        await setDoc(callRef, {
          from: me.uid,
          to: peerUid,
          fromName: me.displayName || me.email.split("@")[0],
          toName: peer?.name || "User",
          toPhoto: peer?.photo || "",
          type,
          status: "ringing",
          createdAt: serverTimestamp()
        });
        location.href = `call.html?callId=${callRef.id}&role=caller&type=${type}`;
      } catch (e) {
        console.error(e);
        toast("Call shuru nahi ho payi", "error");
      }
    }

    /* ---------- Chat sheet ---------- */
    const sheet = document.getElementById("chatSheet");
    const backdrop = document.getElementById("sheetBackdrop");
    function openSheet() { sheet.hidden = false; backdrop.hidden = false; requestAnimationFrame(() => sheet.classList.add("in")); }
    function closeSheet() { sheet.classList.remove("in"); setTimeout(() => { sheet.hidden = true; backdrop.hidden = true; }, 220); }
    document.getElementById("chatMenuBtn").onclick = openSheet;
    backdrop.onclick = closeSheet;

    document.getElementById("clearChatItem").onclick = async () => {
      closeSheet();
      if (!confirm("Saare messages delete karne hain?")) return;
      try {
        const snap = await getDocs(collection(db, "chats", chatId, "messages"));
        const batch = writeBatch(db);
        snap.docs.forEach(d => batch.delete(d.ref));
        await batch.commit();
        await updateDoc(chatRef, { lastMessage: "", lastSender: "", lastMessageAt: serverTimestamp() });
        toast("Chat clear ho gayi 🧹", "success");
      } catch (e) { toast("Clear nahi ho payi", "error"); }
    };

    document.getElementById("deleteChatItem").onclick = async () => {
      closeSheet();
      if (!confirm("Poori chat delete karne hain?")) return;
      try {
        const snap = await getDocs(collection(db, "chats", chatId, "messages"));
        const batch = writeBatch(db);
        snap.docs.forEach(d => batch.delete(d.ref));
        batch.delete(chatRef);
        await batch.commit();
        toast("Chat delete ho gayi", "success");
        setTimeout(() => location.href = "dashboard.html", 500);
      } catch (e) { toast("Delete nahi ho payi", "error"); }
    };

    /* ---------- Helpers ---------- */
    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, m =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
    }
    function linkify(s) {
      return s.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    }
    function fmtTime(ts) {
      const d = new Date(ts);
      return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }
    function dayLabel(ts) {
      const d = new Date(ts);
      const today = new Date();
      const yest = new Date(); yest.setDate(today.getDate() - 1);
      const same = (a, b) => a.toDateString() === b.toDateString();
      if (same(d, today)) return "Aaj";
      if (same(d, yest)) return "Kal";
      return d.toLocaleDateString([], { day: "numeric", month: "short", year: "numeric" });
    }
  </script>
</body>
</html>
