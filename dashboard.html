<!DOCTYPE html>
<html lang="hi" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ChatWave — Chats</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>" />
<script>document.documentElement.dataset.theme = localStorage.getItem("cw-theme") || "dark";</script>
</head>
<body class="app-body">

  <div class="app">
    <!-- ===== TOP BAR ===== -->
    <header class="topbar">
      <div class="topbar-left">
        <div class="logo-mini">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
          </svg>
        </div>
        <h1>ChatWave</h1>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" id="themeBtn" title="Theme">🌙</button>
        <button class="icon-btn" id="menuBtn" title="Menu">⋮</button>
        <div class="avatar sm" id="myAvatar" title="Profile">?</div>
      </div>
    </header>

    <!-- ===== SEARCH ===== -->
    <div class="searchbar">
      <span class="s-ico">🔍</span>
      <input id="searchInput" type="search" placeholder="Chat ya naam dhundo…" />
      <button class="s-clear" id="clearSearch" hidden>✕</button>
    </div>

    <!-- ===== TABS ===== -->
    <nav class="seg-tabs">
      <button class="seg active" data-view="chats">Chats</button>
      <button class="seg" data-view="people">Log</button>
    </nav>

    <!-- ===== LIST ===== -->
    <main class="list-wrap">
      <div id="chatList" class="list"></div>

      <!-- Empty state -->
      <div class="empty" id="emptyState" hidden>
        <div class="empty-ico">💬</div>
        <h3 id="emptyTitle">Koi chat nahi hai</h3>
        <p id="emptyText">"Log" tab se kisi ko chuno aur baat shuru karo.</p>
      </div>

      <!-- Skeletons -->
      <div class="list" id="skeletons">
        <div class="skel-item"><div class="skel av"></div><div class="skel-lines"><div class="skel l1"></div><div class="skel l2"></div></div></div>
        <div class="skel-item"><div class="skel av"></div><div class="skel-lines"><div class="skel l1"></div><div class="skel l2"></div></div></div>
        <div class="skel-item"><div class="skel av"></div><div class="skel-lines"><div class="skel l1"></div><div class="skel l2"></div></div></div>
        <div class="skel-item"><div class="skel av"></div><div class="skel-lines"><div class="skel l1"></div><div class="skel l2"></div></div></div>
      </div>
    </main>

    <!-- ===== FAB ===== -->
    <button class="fab" id="newChatFab" title="Nayi chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
    </button>
  </div>

  <!-- ===== PROFILE SHEET ===== -->
  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <aside class="sheet" id="profileSheet" hidden>
    <div class="sheet-head">
      <div class="avatar lg" id="sheetAvatar">?</div>
      <h3 id="sheetName">—</h3>
      <p id="sheetEmail">—</p>
    </div>
    <div class="sheet-actions">
      <button class="sheet-item" id="themeItem">🌗 <span>Theme badlo</span></button>
      <button class="sheet-item danger" id="logoutItem">🚪 <span>Logout</span></button>
    </div>
    <p class="sheet-foot">ChatWave v1.0</p>
  </aside>

  <div class="toast-wrap" id="toastWrap"></div>

  <script type="module">
    import {
      auth, db, toast, timeAgo, initials, avatarColor, initCallListener, watchAuth
    } from "./firebase.js";
    import {
      signOut, onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      collection, query, where, onSnapshot, doc, getDoc, setDoc,
      updateDoc, serverTimestamp, orderBy
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    /* ---------- Theme ---------- */
    const themeBtn = document.getElementById("themeBtn");
    function paintTheme() {
      const t = document.documentElement.dataset.theme;
      themeBtn.textContent = t === "dark" ? "🌙" : "☀️";
    }
    paintTheme();
    themeBtn.onclick = () => {
      const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = next;
      localStorage.setItem("cw-theme", next);
      paintTheme();
    };

    let me = null;
    let view = "chats";
    let allChats = [];
    let allUsers = [];
    let searchTerm = "";
    let unsubChats = null;

    const chatListEl = document.getElementById("chatList");
    const emptyState = document.getElementById("emptyState");
    const emptyTitle = document.getElementById("emptyTitle");
    const emptyText = document.getElementById("emptyText");
    const skeletons = document.getElementById("skeletons");

    /* ---------- Auth guard ---------- */
    onAuthStateChanged(auth, async (user) => {
      if (!user) { location.replace("index.html"); return; }
      me = user;

      // profile chip
      const myDoc = await getDoc(doc(db, "users", user.uid));
      const data = myDoc.exists() ? myDoc.data() : {};
      const name = data.name || user.displayName || user.email.split("@")[0];
      document.getElementById("myAvatar").textContent = initials(name);
      document.getElementById("myAvatar").style.background = avatarColor(user.uid);
      document.getElementById("sheetAvatar").textContent = initials(name);
      document.getElementById("sheetAvatar").style.background = avatarColor(user.uid);
      document.getElementById("sheetName").textContent = name;
      document.getElementById("sheetEmail").textContent = user.email;

      // online presence
      const ref = doc(db, "users", user.uid);
      await setDoc(ref, { online: true, lastSeen: serverTimestamp() }, { merge: true });
      window.addEventListener("beforeunload", () => {
        setDoc(ref, { online: false, lastSeen: serverTimestamp() }, { merge: true });
      });

      // incoming call listener
      initCallListener(user);

      loadChats();
      loadUsers();
      skeletons.hidden = false;
      setTimeout(() => { skeletons.hidden = true; }, 700);
    });

    /* ---------- Load chats ---------- */
    function loadChats() {
      if (unsubChats) unsubChats();
      const q = query(collection(db, "chats"), where("members", "array-contains", me.uid));
      unsubChats = onSnapshot(q, async (snap) => {
        const rows = [];
        for (const d of snap.docs) {
          const c = d.data();
          const otherUid = (c.members || []).find(u => u !== me.uid);
          if (!otherUid) continue;
          let other = allUsers.find(u => u.uid === otherUid);
          if (!other) {
            const uDoc = await getDoc(doc(db, "users", otherUid));
            other = uDoc.exists() ? uDoc.data() : { uid: otherUid, name: "Unknown" };
          }
          rows.push({
            id: d.id,
            other,
            lastMessage: c.lastMessage || "",
            lastMessageAt: c.lastMessageAt?.toMillis?.() || 0,
            lastSender: c.lastSender || "",
            unread: c.unread?.[me.uid] || 0,
            typing: !!c.typing?.[otherUid],
            online: !!other.online
          });
        }
        rows.sort((a, b) => b.lastMessageAt - a.lastMessageAt);
        allChats = rows;
        render();
      }, (e) => console.error("chats snapshot", e));
    }

    /* ---------- Load users ---------- */
    function loadUsers() {
      onSnapshot(collection(db, "users"), (snap) => {
        allUsers = snap.docs.map(d => d.data()).filter(u => u.uid !== me.uid);
        // re-resolve chat partner info
        allChats = allChats.map(c => {
          const fresh = allUsers.find(u => u.uid === c.other.uid);
          return fresh ? { ...c, other: fresh, online: !!fresh.online } : c;
        });
        render();
      });
    }

    /* ---------- Render ---------- */
    function render() {
      const term = searchTerm.toLowerCase();
      let rows = view === "chats" ? allChats : [];

      if (view === "people") {
        rows = allUsers
          .filter(u => !term || (u.name || "").toLowerCase().includes(term) || (u.email || "").toLowerCase().includes(term))
          .map(u => ({ people: true, other: u, online: !!u.online }));
      } else {
        rows = rows.filter(r => !term || (r.other.name || "").toLowerCase().includes(term));
      }

      chatListEl.innerHTML = "";

      if (rows.length === 0) {
        emptyState.hidden = false;
        emptyTitle.textContent = view === "chats" ? "Koi chat nahi hai" : "Koi user nahi mila";
        emptyText.textContent = view === "chats"
          ? '"Log" tab se kisi ko chuno aur baat shuru karo.'
          : "Naam se search karke dekho.";
        return;
      }
      emptyState.hidden = true;

      rows.forEach(r => chatListEl.appendChild(rowEl(r)));
    }

    function rowEl(r) {
      const el = document.createElement("button");
      el.className = "chat-item";
      const u = r.other;
      const name = u.name || u.email?.split("@")[0] || "User";

      if (r.people) {
        el.innerHTML = `
          <div class="avatar" style="background:${avatarColor(u.uid)}">
            ${initials(name)}
            <span class="dot ${r.online ? "on" : ""}"></span>
          </div>
          <div class="ci-body">
            <div class="ci-top">
              <span class="ci-name">${esc(name)}</span>
            </div>
            <div class="ci-bottom">
              <span class="ci-msg">${r.online ? "🟢 Online" : "Tap karke chat shuru karo"}</span>
            </div>
          </div>
          <div class="ci-meta"><span class="pill">Chat</span></div>`;
        el.onclick = () => openChat(u.uid);
      } else {
        const mine = r.lastSender === me.uid;
        const tick = mine ? "✓✓ " : "";
        const typingHtml = r.typing ? `<span class="typing-text">typing…</span>` : esc(r.lastMessage || "Chat shuru karo");
        el.innerHTML = `
          <div class="avatar" style="background:${avatarColor(u.uid)}">
            ${initials(name)}
            <span class="dot ${r.online ? "on" : ""}"></span>
          </div>
          <div class="ci-body">
            <div class="ci-top">
              <span class="ci-name">${esc(name)}</span>
              <span class="ci-time">${r.lastMessageAt ? timeAgo(r.lastMessageAt) : ""}</span>
            </div>
            <div class="ci-bottom">
              <span class="ci-msg ${r.typing ? "typing" : ""}">${r.typing ? typingHtml : tick + typingHtml}</span>
              ${r.unread ? `<span class="badge">${r.unread > 99 ? "99+" : r.unread}</span>` : ""}
            </div>
          </div>`;
        el.onclick = () => openChat(u.uid);
      }
      return el;
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, m =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
    }

    function openChat(uid) {
      location.href = `chat.html?u=${encodeURIComponent(uid)}`;
    }

    /* ---------- Tabs ---------- */
    document.querySelectorAll(".seg").forEach(b => {
      b.onclick = () => {
        document.querySelectorAll(".seg").forEach(x => x.classList.remove("active"));
        b.classList.add("active");
        view = b.dataset.view;
        render();
      };
    });

    /* ---------- Search ---------- */
    const searchInput = document.getElementById("searchInput");
    const clearSearch = document.getElementById("clearSearch");
    searchInput.oninput = () => {
      searchTerm = searchInput.value.trim();
      clearSearch.hidden = !searchTerm;
      render();
    };
    clearSearch.onclick = () => {
      searchInput.value = ""; searchTerm = "";
      clearSearch.hidden = true;
      render();
    };

    /* ---------- FAB ---------- */
    document.getElementById("newChatFab").onclick = () => {
      document.querySelector('.seg[data-view="people"]').click();
      searchInput.focus();
    };

    /* ---------- Profile sheet ---------- */
    const sheet = document.getElementById("profileSheet");
    const backdrop = document.getElementById("sheetBackdrop");
    function openSheet() { sheet.hidden = false; backdrop.hidden = false; requestAnimationFrame(() => sheet.classList.add("in")); }
    function closeSheet() { sheet.classList.remove("in"); setTimeout(() => { sheet.hidden = true; backdrop.hidden = true; }, 220); }
    document.getElementById("menuBtn").onclick = openSheet;
    document.getElementById("myAvatar").onclick = openSheet;
    backdrop.onclick = closeSheet;
    document.getElementById("themeItem").onclick = () => { themeBtn.click(); };
    document.getElementById("logoutItem").onclick = async () => {
      if (me) await setDoc(doc(db, "users", me.uid), { online: false, lastSeen: serverTimestamp() }, { merge: true });
      await signOut(auth);
      location.replace("index.html");
    };
  </script>
</body>
</html>
